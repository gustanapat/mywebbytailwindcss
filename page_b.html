<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gus Profile 2026</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ตั้งค่า Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ["IBM Plex Mono"],
                        raleway: ["Raleway"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-[#080808]">
    <!-- ส่วนที่ 1 NAV BAR -->
    <div
        class="flex justify-between items-center bg-[#1B1B1B] py-[40px] px-[100px] mx-[150px] rounded-b-[20px]">
        <!-- Menu -->
        <div class="flex gap-[60px] font-mono">
            <a href="" class="text-[#9C9C9C] hover:text-[#62BA1B]">Home</a>
            <a href="" class="text-[#9C9C9C] hover:text-[#62BA1B]">Case Studies</a>
            <a href="" class="text-[#9C9C9C] hover:text-[#62BA1B]">Testimonials</a>
            <a href="" class="text-[#9C9C9C] hover:text-[#62BA1B]">Recent work</a>
            <a href="" class="text-[#9C9C9C] hover:text-[#62BA1B]">Get In Touch</a>
        </div>

        <!-- Social Icon -->
        <div class="flex gap-5">
            <a href="" class="text-[#9C9C9C] text-xl hover:text-[#62BA1B]"><i class="bi bi-linkedin"></i></a>
            <a href="" class="text-[#9C9C9C] text-xl hover:text-[#62BA1B]"><i class="bi bi-behance"></i></a>
            <a href="" class="text-[#9C9C9C] text-xl hover:text-[#62BA1B]"><i class="bi bi-twitter"></i></a>
        </div>
    </div>

    <!-- ส่วนที่ 2 HERO PROFILE -->
    <div class="flex items-center mx-[250px] mt-[100px] gap-[150px]">
        <!-- ข้อมูลด้านซ้าย -->
        <div class="w-full flex flex-col gap-[30px]">
            <!-- ชื่อ -->
            <span class="text-white font-raleway text-5xl font-bold">Tanapat Srirabay</span>
            <!-- รายละเอียด -->
            <span class="font-mono text-[#9C9C9C] text-lg leading-8">
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Nesciunt rem odit labore unde nemo omnis sequi hic sit
                laudantium repellendus recusandae vitae ea laborum, ipsa
                nisi eos autem.
            </span>
            <!-- Button -->
            <a href="" class="w-[400px] h-[80px] bg-[#3F9D00] border-2 border-[#62BA1B] text-white font-mono font-bold text-lg flex justify-center items-center rounded-[5px] shadow-[0_0_20px_#62BA1B] hover:bg-[#62BA1B]">
                Let’s get started &nbsp;
                <i class="bi bi-chevron-right"></i>
            </a>
        </div>

        <!-- รูป Profile ด้านขวา -->
        <div class="w-full flex justify-center">
            <img src="./images/profile.jpg" alt="profile" class="w-[400px] h-[400px] object-cover rounded-full">
        </div>
    </div>

    <!-- ส่วนที่ 3 WORKED WITH -->
    <div class="mx-[250px] mt-[80px]">
        <p class="text-white font-mono text-lg">Worked with</p>
    </div>

    <!-- ส่วนที่ 4 COMPANY LOGO -->
    <div class="mx-[250px] mt-[30px] mb-[100px] flex justify-between gap-8">

        <!-- ClickUp -->
        <a href="" class="w-[200px] h-[70px] border-2 border-[#1B1B1B] rounded-[8px] flex justify-center items-center hover:border-[#62BA1B] hover:shadow-[0_0_10px_#62BA1B]">
            <img src="./images/logo1.png" alt="ClickUp" class="max-w-[130px] max-h-[40px]">
        </a>

        <!-- Dropbox -->
        <a href="" class="w-[200px] h-[70px] border-2 border-[#1B1B1B] rounded-[8px] flex justify-center items-center hover:border-[#62BA1B] hover:shadow-[0_0_10px_#62BA1B]">
            <img src="./images/logo2.png" alt="Dropbox" class="max-w-[130px] max-h-[40px]">
        </a>

        <!-- Paychex -->
        <a href="" class="w-[200px] h-[70px] border-2 border-[#1B1B1B] rounded-[8px] flex justify-center items-center hover:border-[#62BA1B] hover:shadow-[0_0_10px_#62BA1B]">
            <img src="./images/logo3.png" alt="Paychex" class="max-w-[130px] max-h-[40px]">
        </a>

        <!-- Elastic -->
        <a href="" class="w-[200px] h-[70px] border-2 border-[#1B1B1B] rounded-[8px] flex justify-center items-center hover:border-[#62BA1B] hover:shadow-[0_0_10px_#62BA1B]">
            <img src="./images/logo4.png" alt="Elastic" class="max-w-[130px] max-h-[40px]">
        </a>

        <!-- Stripe -->
        <a href="" class="w-[200px] h-[70px] border-2 border-[#1B1B1B] rounded-[8px] flex justify-center items-center hover:border-[#62BA1B] hover:shadow-[0_0_10px_#62BA1B]">
            <img src="./images/logo5.png" alt="Stripe" class="max-w-[130px] max-h-[40px]">
        </a>

    </div>

</body>

</html>
