<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Design</title>
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ตั้งค่า Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ["Roboto Mono"],
                    },
                },
            },
        };
    </script>

</head>

<body class="bg-[#91FFB2] font-mono text-[#222] min-h-screen">

        <div class="w-[550px]">

            <h1 class="text-[2.7rem] font-bold leading-[1.4] mb-[25px]">

            <p class="w-[430px] text-base leading-[1.5]">
                Lorem ipsum dolor sit amet, <br>
                consectetur adipiscing elit. <br>
                Cursus imperdiet sed id elementum. <br>
                Quam vel aliquam sit vulputate.
            </p>

            <button class="bg-[#333333] text-white rounded-full py-[13px] px-[35px] mt-[10px] hover:bg-black">Follow Me</button>

            <!-- SMALL PICTURE -->
            <div class="flex gap-[30px] mt-[80px]">
                <!-- Page A -->
                <a href="./page_a.html">
                    <img src="./images/pic1.png" alt="pic1" class="w-[240px] h-[135px] object-cover">

        <div class="w-[220px]">

        </div>

        <!-- SECTION 3 -->
        <div class="w-[130px]">
            <a href="./page_d.html">
                <img src="./images/pic4.png" alt="pic4" class="w-[120px] h-[540px] object-cover">

    <div class="text-center text-xs mt-[30px] pb-[20px]">
        <p class="my-[3px]">(รูปและเนื้อหาทั้งหมดใช้เพื่อการศึกษาเท่านั้น)</p>
